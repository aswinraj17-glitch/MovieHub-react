<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141d" />
      <stop offset="50%" stop-color="#0f0f15" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c62828" />
      <stop offset="100%" stop-color="#ed1d24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad)" />

  <!-- Outer Glow Frame -->
  <rect x="15" y="15" width="370" height="570" fill="none" stroke="#c62828" stroke-opacity="0.3" stroke-width="2" rx="12" />

  <!-- Marvel Header Badge -->
  <g transform="translate(145, 35)">
    <rect x="0" y="0" width="110" height="28" fill="#ed1d24" rx="3" />
    <text x="55" y="19" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">MARVEL</text>
  </g>

  <!-- Central Symbol Glow -->
  <circle cx="200" cy="270" r="90" fill="#c62828" fill-opacity="0.15" filter="url(#glow)" />
  <circle cx="200" cy="270" r="70" fill="none" stroke="#c62828" stroke-dasharray="6,6" stroke-width="2" stroke-opacity="0.6" />
  
  <!-- Symbol Icon -->
  <text x="200" y="295" font-family="sans-serif" font-size="70" text-anchor="middle">🕸️</text>

  <!-- Bottom Gradient Overlay -->
  <rect x="0" y="380" width="400" height="220" fill="url(#bgGrad)" opacity="0.9" />

  <!-- Accent Line -->
  <rect x="50" y="440" width="300" height="3" fill="url(#accentGrad)" rx="1.5" />

  <!-- Title Text -->
  <switch>
    <foreignObject x="30" y="455" width="340" height="85">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color:#ffffff; font-family:system-ui, -apple-system, sans-serif; font-weight:800; font-size:22px; text-align:center; text-transform:uppercase; line-height:1.2; display:flex; align-items:center; justify-center; height:100%;">
        Spider-Man: Far From Home
      </div>
    </foreignObject>
    <text x="200" y="490" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Spider-Man: Far From</text>
  </switch>

  <!-- Release Year Badge -->
  <text x="200" y="555" font-family="sans-serif" font-size="14" font-weight="600" fill="#a0a0b0" text-anchor="middle" letter-spacing="3">2019 • CINEMATIC EDITION</text>
</svg>